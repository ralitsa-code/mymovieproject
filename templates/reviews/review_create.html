{% extends 'base.html' %}
{% load static %}

{% block title %}Add Review | MyMovie{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/review_create.css' %}">
{% endblock %}

{% block content %}
    <section class="review-create">
        <div class="review-container">
            <h1>Add a Review</h1>
            <p class="review-subtitle">Share your thoughts about this movie.</p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="button button-primary">
                    Submit Review
                </button>
            </form>
        </div>
    </section>
{% endblock %}

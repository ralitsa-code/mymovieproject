
{% extends 'base.html' %}
{% load static %}

{% block title %}Server Error | MyMovie{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/errors.css' %}">
{% endblock %}

{% block content %}
<section class="error-section">

        <p class="error-code">500</p>

        <a href="{% url 'home' %}" class="button button-primary">
            Back to Home
        </a>
    </div>
</section>
{% endblock %}

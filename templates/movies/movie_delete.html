{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Movie | MyMovie{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/movie_create.css' %}">
{% endblock %}

{% block content %}
    <section class="movie-form-section">
    <form class="movie-form movie-delete-form" method="post">
        <div class="movie-form-container">
            <h1>Delete Movie</h1>

            {% csrf_token %}
            {{ form.as_p }}

            <p>Are you sure you want to delete this movie?</p>
        </div>

        <button type="submit">Confirm Delete</button>
    </form>
</section>

{% endblock %}

{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Movie | MyMovie{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/movie_create.css' %}">
{% endblock %}

{% block content %}
<section class="movie-form-section">
    <form class="movie-form" method="post" enctype="multipart/form-data">
        <div class="movie-form-container">
            <h1>Edit Movie</h1>
            {% csrf_token %}
            {{ form.as_p }}
        </div>
        <button type="submit">Save Changes</button>
    </form>
</section>
{% endblock %}
